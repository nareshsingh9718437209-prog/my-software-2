<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI & Connected Services – DotERP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fff8e8;--sky:#e3f1fb;--navy:#0f4c81;--ink:#14243a;--mut:#51627a;--acc:#f59e0b;--accink:#2a1a00;--card:#fff;--line:#c9d8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a12;--sky:#10202f;--navy:#0b3558;--ink:#eef3f9;--mut:#a9b8ca;--card:#172a3d;--line:#2c4560;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a12;--sky:#10202f;--navy:#0b3558;--ink:#eef3f9;--mut:#a9b8ca;--card:#172a3d;--line:#2c4560;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,Segoe UI,Arial,sans-serif;background:var(--sky);color:var(--ink);line-height:1.55}
a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
nav{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
nav .wrap{display:flex;align-items:center;gap:22px;height:56px;font-size:14px}.logo{font-weight:700;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--acc)}.sp{flex:1}
.btn{display:inline-block;background:var(--acc);color:var(--accink);font-weight:600;font-size:13px;padding:9px 18px;border-radius:4px;border:0;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(245,158,11,.45)}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:rgba(255,255,255,.55);transform:skewX(-20deg)}.btn:hover:after{animation:shine .6s}
.hero{background:var(--bg);height:340px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(520px circle at var(--hx,50%) var(--hy,40%),rgba(255,205,80,.4),transparent 62%);pointer-events:none}
.hero h1{position:absolute;left:0;right:0;bottom:34px;text-align:center;margin:0;font-size:clamp(28px,4vw,42px);letter-spacing:-1px;z-index:2;animation:up .7s backwards}
.ti{position:absolute;width:64px;height:64px;border:2px solid #f5b324;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#d98a00;font-size:26px;background:rgba(255,214,102,calc(.18 + var(--b,0)*.5));text-shadow:0 0 10px rgba(245,158,11,.9);scale:calc(1 + var(--b,0)*.25);transition:scale .3s,background .3s;animation:float 5s ease-in-out infinite,glow 3s ease-in-out infinite,on 1.4s backwards}
.ti:before{content:"";position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,60,.4),transparent 65%);z-index:-1;animation:halo 3s ease-in-out infinite}
.band{background:linear-gradient(120deg,var(--navy),#0a6aa8,var(--navy));background-size:200% 200%;animation:bgm 14s ease infinite;color:#fff;padding:60px 0}
h2.sh{text-align:center;font-size:clamp(24px,3.4vw,36px);margin:0 0 34px;letter-spacing:-.5px}
.g3,.demo{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ft{position:relative;overflow:hidden;background:var(--sky);color:var(--ink);border-radius:6px;padding:24px;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}.ft:hover{transform:translateY(-8px);box-shadow:0 16px 30px rgba(0,0,0,.3)}.ft.hl{background:var(--bg)}
.ft:before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(245,158,11,.25),transparent 60%);opacity:0;transition:opacity .3s}.ft:hover:before{opacity:1}.ft>*{position:relative}
.ic{width:44px;height:44px;border-radius:10px;background:var(--card);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin-bottom:14px;transition:.3s}.ft:hover .ic{background:var(--acc);color:var(--accink);transform:rotate(-8deg) scale(1.12)}
.ft h3{margin:0 0 8px;font-size:15px}.ft p{margin:0 0 16px;font-size:13px;color:var(--mut)}.ft .btn{margin-top:auto;width:max-content}
section.s{padding:64px 0}.alt{background:var(--sky)}
.dc{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;transition:transform .3s;display:flex;flex-direction:column}.dc:hover{transform:translateY(-6px)}.dc h3{margin:0 0 8px;font-size:15px}.dc p{font-size:13px;color:var(--mut);margin:0 0 16px}.dc .btn{width:max-content;margin-top:auto}
.ad{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}.ad ul{list-style:none;padding:0;margin:0}.ad li{padding:12px 0 12px 26px;position:relative;font-size:14px;transition:transform .25s}.ad li:hover{transform:translateX(6px)}.ad li:before{content:"»";position:absolute;left:0;color:var(--navy);font-weight:700}
.ph{width:min(100%,380px);margin:0 auto;background:#111c2a;border-radius:26px;padding:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);animation:float 6s ease-in-out infinite}
.ph .sc{background:var(--card);border-radius:16px;padding:12px;min-height:200px;font-size:11px}.ph .u{background:var(--sky);border-radius:99px;padding:5px 12px;color:var(--mut);margin-bottom:12px}
.ph .r{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);animation:up .5s backwards}.ph .r span{height:9px;border-radius:4px;background:var(--line)}.ph .r.y{background:rgba(245,158,11,.25)}
.ph .r:nth-child(3){animation-delay:.15s}.ph .r:nth-child(4){animation-delay:.3s}.ph .r:nth-child(5){animation-delay:.45s}.ph .r:nth-child(6){animation-delay:.6s}
footer{background:var(--navy);color:#fff;padding:22px 0;font-size:13px;text-align:center}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes bgm{50%{background-position:100% 50%}}@keyframes shine{to{left:130%}}
@keyframes glow{0%,100%{box-shadow:0 0 10px 2px rgba(245,158,11,.4),0 0 30px 8px rgba(245,158,11,.18),inset 0 0 10px rgba(255,214,102,.5)}50%{box-shadow:0 0 22px 6px rgba(245,158,11,.8),0 0 64px 20px rgba(245,158,11,.38),inset 0 0 16px rgba(255,214,102,.8)}}
@keyframes halo{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
@keyframes on{0%{opacity:.12;filter:grayscale(1) brightness(.6)}10%{opacity:1;filter:none}16%{opacity:.2}26%{opacity:1}32%{opacity:.35}48%{opacity:1}100%{opacity:1}}
@media(max-width:860px){.g3,.demo,.ad{grid-template-columns:1fr}.ti:nth-child(n+7){display:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
a:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>

<script>
(function(){

var T=['▤','◔','⌂','⚙','✓','⇄','☰','₹','⌕','⬚'],hp=[[8,22],[24,8],[24,52],[40,30],[52,6],[56,46],[68,24],[80,10],[82,48],[92,28]];
hp.forEach(function(p,i){var t=el('div','ti',T[i]);t.style.left=p[0]+'%';t.style.top=p[1]+'%';t.style.animationDelay=(i*.5)+'s,'+(i*.3)+'s,'+(i*.22)+'s';$('hero').appendChild(t);});
var H=$('hero');H.addEventListener('mousemove',function(e){var r=H.getBoundingClientRect();H.style.setProperty('--hx',(e.clientX-r.left)+'px');H.style.setProperty('--hy',(e.clientY-r.top)+'px');H.querySelectorAll('.ti').forEach(function(t){var b=t.getBoundingClientRect(),d=Math.hypot(e.clientX-(b.left+b.width/2),e.clientY-(b.top+b.height/2));t.style.setProperty('--b',Math.max(0,1-d/220).toFixed(2));});});H.addEventListener('mouseleave',function(){H.querySelectorAll('.ti').forEach(function(t){t.style.setProperty('--b',0);});});

F.forEach(function(f){var c=el('div','ft'+(f[4]?' '+f[4]:''));c.appendChild(el('span','ic',f[0]));c.appendChild(el('h3','',f[1]));c.appendChild(el('p','',f[2]));if(f[3]){var b=el('a','btn',f[3]+' ↗');b.href='#';c.appendChild(b);}c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');});$('g').appendChild(c);});
[['Connected banking','Handle payments and bank operations in a single system.'],['DotERP on the cloud','Access and grow your business from anywhere, anytime.'],['DotERP with WhatsApp','Simplify communication for faster business conversations.']].forEach(function(d){var c=el('div','dc');c.appendChild(el('h3','',d[0]));c.appendChild(el('p','',d[1]));var b=el('a','btn','Start Demo ↗');b.href='#';c.appendChild(b);$('demo').appendChild(c);});
['Record or edit a voucher using remote access on the go','On-demand synchronisation lets each location work independently, without staying connected all the time','Control the direction of data sync: send, receive or both','Synchronise data over a private network'].forEach(function(t){$('ad').appendChild(el('li','',t));});
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(a){a.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);setTimeout(function(){x.target.classList.remove('rv','in');x.target.style.transitionDelay='';},1300);}});},{threshold:.1});document.querySelectorAll('.ft,.dc,.ad li,section h2').forEach(function(e,j){e.classList.add('rv');e.style.transitionDelay=(j%3)*.1+'s';io.observe(e);});}
})();
